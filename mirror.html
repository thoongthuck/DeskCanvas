<!DOCTYPE html>
<!-- 바탕화면 층 사진 (main.js 의 mirror) — 붙잡은 캔버스를 찍은 사진 한 장만 보여 줌.
     평소에는 캔버스가 위를 덮어 안 보이고, 윈도우가 창들을 잠깐 치울 때(Alt+Tab 미리 보기 · 창 맞춰 붙이기 도우미 · 작업 보기)만 보임 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Wallpaper Canvas mirror</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #F5F5F5); user-select: none; }
    img { position: fixed; inset: 0; width: 100%; height: 100%; display: block; object-fit: fill; }
    img:not([src]) { display: none; }
  </style>
</head>
<body>
  <img id="shot" alt="" draggable="false">
  <script>
    // 새 사진을 다 불러온 뒤에 바꿈 (바꾸는 사이 빈 화면이 보이지 않게)
    window.showShot = (url) => new Promise((resolve) => {
      const next = new Image();
      next.onload = () => { document.getElementById('shot').src = url; resolve(true); };
      next.onerror = () => resolve(false);
      next.src = url;
    });
    window.setBackdrop = (color) => document.body.style.setProperty('--bg', color);
  </script>
</body>
</html>
